# -----------------------------
# THEME
# -----------------------------
remote_theme: "mmistakes/minimal-mistakes@4.24.0"

plugins:
  - jekyll-remote-theme
  - jekyll-paginate

minimal_mistakes_skin: "default"

# -----------------------------
# SITE SETTINGS
# -----------------------------
locale: "en-US"
title: "Nicolás Budini"
title_separator: "-"
subtitle: "Personal Blog"
name: "Nicolás Budini"

description: >-
  Physicist and university professor based in Argentina.
  I work on digital holography and optical characterization of materials,
  combining experimental optics with computational tools to extract
  quantitative information. I teach physics at undergraduate and
  graduate levels. This blog is a space to share academic and
  educational material.

url: "https://nbudini.github.io"
baseurl: ""

repository: "nbudini/nbudini.github.io"

logo: "/assets/logo.png"

# -----------------------------
# AUTHOR
# -----------------------------
author:
  name: "Nicolás Budini"
  location: "Dpto. de Física, Facultad de Ingeniería Química, UNL (Argentina)"
  email:
  bio: >-
    Physicist working in digital holography and optical characterization
    of nanostructured materials. University professor in physics.

# -----------------------------
# BLOG SETTINGS
# -----------------------------
markdown: kramdown
permalink: /:categories/:title/

paginate: 5
paginate_path: /page:num/

search: true

# -----------------------------
# ANALYTICS
# -----------------------------
analytics:
  provider: google-gtag
  google:
    tracking_id: G-FBE9XX1P28

# -----------------------------
# SEO
# -----------------------------
social:
  name: "Nicolás Budini"
  links:
    - "https://twitter.com/nbudini"

# -----------------------------
# Navigation
# -----------------------------
header:
  nav:
    - title: "Research"
      url: /research/
    - title: "Teaching"
      url: /teaching/
    - title: "Publications"
      url: /publications/
    - title: "CV"
      url: /cv/
