title: Nicolás Budini
description: >-
  Physicist and university professor based in Argentina
theme: jekyll-theme-cayman

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jektex

# Optional: Add your social links
github_username: nbudini
# twitter_username: yourusername

# Cayman theme specific
show_downloads: true
google_analytics: G-FBE9XX1P28

# Optional Jektex configuration
jektex:
  cache_dir: ".jektex-cache"  # Cache location (default: .jekyll-cache)
  silent: false               # Set to true to silence output
  ignore: ["*.xml"]           # Files to ignore (e.g., RSS feeds)
  macros: []                  # Define custom LaTeX macros
