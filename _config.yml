    #   url: "https://gerkelznik.github.io"
    # - label: "Twitter"
    #  icon: "fab fa-fw fa-square-x-twitter"
    #  url: "https://twitter.com/gerkElznik"
    # - label: "Reddit"
    #  icon: "fab fa-fw fa-reddit"
    #  url: "https://www.reddit.com/user/gerkElznik"
    # - label: "Facebook"
    #   icon: "fab fa-fw fa-facebook-square"
    #   url: "https://facebook.com/"
     - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/nbudini"
    - label: "Medium"
      icon: "fab fa-medium"
      url: "https://medium.com/@budinense"
