# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# Theme Settings
#
# Review documentation to determine if you should use `theme` or `remote_theme`
# https://mmistakes.github.io/minimal-mistakes/docs/quick-start-guide/#installing-the-theme

# theme                  : "minimal-mistakes-jekyll"
remote_theme           : "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin    : "default" # "default", "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"

# Site Settings
locale                   : "en-US"
title                    : "Nicolás Budini"
title_separator          : "-"
subtitle                 : Personal Blog
name                     : "Nicolás Budini"
description              : >-
  Interesting educational material for learning physics: problems and solutions, course notes, and so on
url                      : "https://nbudini.github.io"
baseurl                  : # the subpath of your site, e.g. "/blog"
repository               : "nbudini/nbudini.github.io"
teaser                   : #"/assets/images/face-art.jpg" # path of fallback teaser image, e.g. "/assets/images/500x300.png"
logo                     : #"/assets/images/face-art.jpg" # path of logo image to display in the masthead, e.g. "/assets/images/88x88.png"
masthead_title           : # overrides the website title displayed in the masthead, use " " for no title
# breadcrumbs            : false # true, false (default)
words_per_minute         : #220
comments:
  provider               : # false (default), "disqus", "discourse", "facebook", "staticman", "staticman_v2", "utterances", "giscus", "custom"
  disqus:
    shortname            : # https://help.disqus.com/customer/portal/articles/466208-what-s-a-shortname-
  discourse:
    server               : # https://meta.discourse.org/t/embedding-discourse-comments-via-javascript/31963 , e.g.: meta.discourse.org
  facebook:
    # https://developers.facebook.com/docs/plugins/comments
    appid                :
    num_posts            : # 5 (default)
    colorscheme          : # "light" (default), "dark"
  utterances:
    theme                : # "github-light" (default), "github-dark"
    issue_term           : # "pathname" (default)
  giscus:
    repo_id              : # Shown during giscus setup at https://giscus.app
    category_name        : # Full text name of the category
    category_id          : # Shown during giscus setup at https://giscus.app
    discussion_term      : # "pathname" (default), "url", "title", "og:title"
    reactions_enabled    : # '1' for enabled (default), '0' for disabled
    theme                : # "light" (default), "dark", "dark_dimmed", "transparent_dark", "preferred_color_scheme"
  staticman:
    branch               : # "master"
    endpoint             : # "https://{your Staticman v3 API}/v3/entry/github/"
reCaptcha:
  siteKey                :
  secret                 :
atom_feed:
  path                   : # blank (default) uses feed.xml
  hide                   : # true, false (default)
search                   : true # true, false (default)
search_full_content      : # true, false (default)
search_provider          : # lunr (default), algolia, google
algolia:
  application_id         : # YOUR_APPLICATION_ID
  index_name             : # YOUR_INDEX_NAME
  search_only_api_key    : # YOUR_SEARCH_ONLY_API_KEY
  powered_by             : # true (default), false
google:
  search_engine_id       : # YOUR_SEARCH_ENGINE_ID
  instant_search         : # false (default), true
# SEO Related
google_site_verification : # 3CEnxMa8UrNzO7wrheeaW2oG_EozpPJRhbEmWUCZPrU
bing_site_verification   :
naver_site_verification  :
yandex_site_verification :
baidu_site_verification  :

# Social Sharing
twitter:
  username               : "nbudini"
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 : #"/assets/images/face-art.jpg" # Open Graph/Twitter default site image
# For specifying social profiles
# - https://developers.google.com/structured-data/customize/social-profiles
social:
  type                   : # Person or Organization (defaults to Person)
  name                   : # If the user or organization name differs from the site's name
  links: # An array of links to social media profiles

# Analytics
analytics:
  provider               : # google-gtag # false (default), "google", "google-universal", "google-gtag", "custom"
  google:
    tracking_id          : # G-D8VLPJ9V2N
    anonymize_ip         : # true, false (default)


# Site Author
author:
  name             : "Nicolás Budini"
  avatar           : # "/assets/images/cartoon-avatar.jpg" # path of avatar image, e.g. "/assets/images/bio-photo.jpg"
  bio              : >-
    Welcome to my personal blog, and thanks for visiting. I’m Nicolás, a physicist and university professor based in Argentina.
    I work on digital holography and optical characterization of materials, combining experimental optics with computational tools
    to extract quantitative information. I teach physics at both undergraduate and graduate levels, from introductory courses to
    advanced topics. This blog is a space where I share educational and academic material, along with reflections on teaching and physics.
    This is a place to share things that might be useful to others.
  location         : "Dpto. de Física, Facultad de Ingeniería Química, Universidad Nacional del Litoral (Santa Fe, Argentina)"
  email            : 
  links:
     - label: "Email"
       icon: "fas fa-fw fa-envelope-square"
       url: "mailto:nbudini@fiq.unl.edu.ar"
    # - label: "Website"
