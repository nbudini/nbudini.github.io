<!DOCTYPE html>

<head>

  <title>{{ page.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      display: flex;
      max-width: 1000px;
      margin-left: auto;
      margin-right: auto;
    }

    nav {
      width: 220px;
      padding: 60px 20px;
      border-right: 1px solid #eee;
    }

    nav h1 {
      font-size: 20px;
      margin-bottom: 30px;
      font-weight: 600;
    }

    nav a {
      display: block;
      margin: 12px 0;
      color: #444;
      text-decoration: none;
      font-size: 15px;
    }

    nav a:hover {
      color: #000;
    }

    main {
      flex: 1;
      padding: 60px 40px;
    }

    h1, h2, h3 {
      font-weight: 600;
    }
  </style>
</head>
